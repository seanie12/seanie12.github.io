<li class="paper">
  <p class="paper-venue">{{ paper.venue | escape }} · {{ paper.year }}</p>
  <h3>{{ paper.title | escape }}</h3>
  <div class="paper-authors">{{ paper.authors | markdownify }}</div>
  <div class="paper-links">
    {% for link in paper.links %}
    <a href="{{ link.url | escape }}">{{ link.label }}</a>
    {% endfor %}
  </div>
</li>
