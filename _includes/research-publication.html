<li class="paper">
  <div class="paper-meta">
    <p class="paper-topic">{{ paper.topic | escape }}</p>
    <p class="paper-date">{{ paper.venue | escape }} · {{ paper.year }}</p>
  </div>
  <div>
    <h3>{{ paper.title | escape }}</h3>
    <p class="paper-summary">{{ paper.summary | escape }}</p>
    <div class="paper-links">
      {% for link in paper.links %}
      <a href="{{ link.url | escape }}">{{ link.label }}</a>
      {% endfor %}
    </div>
  </div>
</li>
